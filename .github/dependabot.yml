version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "main"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"

    groups:
      # Batch all @types/* patch and minor bumps into one PR — they are
      # almost always safe no-ops for runtime behaviour and reviewing them
      # individually wastes reviewer time.
      types-updates:
        patterns:
          - "@types/*"
        update-types:
          - "minor"
          - "patch"

      # Group all remaining patch-level updates into a single PR to reduce noise.
      patch-updates:
        patterns:
          - "*"
        update-types:
          - "patch"

    # Ignore major version bumps for core dependencies
    ignore:
      - dependency-name: "next"
        update-types: ["version-update:semver-major"]
        # Reason: Major Next.js updates (e.g., v14 to v15) often introduce breaking App Router changes requiring manual migration.
      - dependency-name: "@stellar/stellar-sdk"
        update-types: ["version-update:semver-major"]
        # Reason: Major Stellar SDK bumps usually include breaking Soroban RPC changes that require smart contract compatibility checks.

  # Workflow `uses:` references are pinned to commit SHAs (supply-chain
  # security — see .github/workflows/*.yml) so Dependabot needs its own
  # ecosystem entry to keep those pins current.
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "main"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci"

  # packages/indexer has its own package.json (see its README) — Dependabot
  # scopes updates per-directory, so it needs its own entry or its
  # dependencies (currently just typescript/@types/node) go unmonitored.
  - package-ecosystem: "npm"
    directory: "/packages/indexer"
    target-branch: "main"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"

    groups:
      # Batch @types/* patch/minor bumps in the indexer package too.
      types-updates:
        patterns:
          - "@types/*"
        update-types:
          - "minor"
          - "patch"

      # Group all remaining patch-level updates into a single PR to reduce noise.
      patch-updates:
        patterns:
          - "*"
        update-types:
          - "patch"

  # Monitor GitHub Actions themselves for updates (runner images, action
  # versions like actions/checkout@v4). Weekly cadence matches the npm entries.
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "main"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"

    # Group all action patch/minor bumps into one PR — major bumps (e.g.,
    # actions/checkout v3 → v4) are intentionally left ungrouped so they
    # get their own PR with a clear title.
    groups:
      actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"